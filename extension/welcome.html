<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PreSend Translate</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="welcome-body">
  <main class="welcome-sheet">
    <img src="icons/icon128.png" alt="" class="welcome-icon">
    <h1 data-i18n="welcomeTitle">PreSend Translate is installed</h1>
    <p data-i18n="welcomeBody">Refresh pages that were already open before installation. New pages will work automatically.</p>
    <div class="welcome-instruction" data-i18n="welcomeHint">After refreshing, focus a text field to see the target-language button.</div>
    <button id="open-settings" type="button" class="primary" data-i18n="welcomeAction">Open settings</button>
  </main>
  <script src="i18n.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
